name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo-safe run
        run: python main.py --demo-script
  atk-cli-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned ATK CLI
        run: npm ci
      - name: Verify CLI is installed
        run: npx --no-install okx --version
